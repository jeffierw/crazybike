<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>CRAZYBIKE · 暴走速降</title>
  <style>
    :root {
      --bg: #0f1115;
      --ink: #f6f4ef;
      --muted: rgba(246, 244, 239, 0.68);
      --accent: #ff5b1f;
      --gold: #ffc43d;
      --cyan: #38e2ff;
      --danger: #ff3155;
      --panel: rgba(14, 17, 23, 0.82);
      --border: rgba(255, 255, 255, 0.14);
      --sl: env(safe-area-inset-left, 0px);
      --sr: env(safe-area-inset-right, 0px);
      --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #app {
      position: fixed; inset: 0; overflow: hidden; background: #12100e;
    }
    #gl {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none;
    }
    #ui {
      position: absolute; inset: 0; pointer-events: none;
      padding: var(--st) var(--sr) var(--sb) var(--sl);
    }
    .clickable { pointer-events: auto; }
    .btn {
      pointer-events: auto; cursor: pointer; border: 1px solid var(--border);
      background: rgba(20, 23, 30, 0.86); color: var(--ink);
      padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 14px;
      letter-spacing: 0.04em; transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: rgba(38, 44, 56, 0.94); border-color: rgba(255,255,255,0.34); }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: linear-gradient(135deg, #ff6a26, #e63917); border-color: rgba(255, 210, 170, 0.45);
      color: #fff; box-shadow: 0 6px 22px rgba(255, 91, 31, 0.35);
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.gold {
      background: linear-gradient(135deg, #ffd15c, #f29d18); color: #161108; border-color: rgba(255,245,200,0.6);
    }
    .hud-chip {
      background: rgba(12, 15, 20, 0.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 8px 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="ui"></div>
  </div>
  <script>
/*__JS__*/
  </script>
</body>
</html>
