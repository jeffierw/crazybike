<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>暴走速降 · CRAZYBIKE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;500;700&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #07090d;
      --snow: #f5f3ee;
      --dim: rgba(245, 243, 238, 0.66);
      --faint: rgba(245, 243, 238, 0.38);
      --hair: rgba(245, 243, 238, 0.20);
      --sun: #ffd08a;
      --accent: #ff5b1f;
      --cyan: #38e2ff;
      --danger: #ff3155;
      --f-song: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", serif;
      --f-lat: "Jost", "Futura", "Avenir Next", "Century Gothic", "Segoe UI", system-ui, sans-serif;
      --f-ui: "Jost", "Futura", "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
      --sl: env(safe-area-inset-left, 0px);
      --sr: env(safe-area-inset-right, 0px);
      --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px);
      --gl: max(24px, var(--sl));
      --gr: max(24px, var(--sr));
      --gt: calc(var(--st) + 18px);
      --gb: calc(var(--sb) + 20px);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--ink); color: var(--snow); font-family: var(--f-ui);
    }
    #app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

    /* ---- Loading Progress Veil (Cold-Smoke editorial style) ---- */
    #load {
      position: fixed; inset: 0; z-index: 50; background: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.85s cubic-bezier(0.3, 0, 0.2, 1), visibility 0s linear 0.85s;
    }
    #load.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .mark { display: flex; flex-direction: column; align-items: flex-start; }
    .mark.center { align-items: center; text-align: center; }
    .mark .cn {
      font-family: var(--f-song); font-weight: 700; font-size: clamp(38px, 6.2vw, 68px);
      line-height: 1.04; letter-spacing: 0.34em; margin-right: -0.34em;
      text-shadow: 0 2px 28px rgba(5, 8, 13, 0.55);
    }
    .mark .cn.en-word {
      font-family: var(--f-lat); font-weight: 600; font-size: clamp(28px, 3.6vw, 44px);
      letter-spacing: 0.20em; margin-right: -0.20em;
    }
    .mark .rule { width: 32px; height: 1px; background: var(--sun); margin: 16px 0 13px; }
    .mark .en {
      font-family: var(--f-lat); font-weight: 400; font-size: clamp(11px, 1.3vw, 13px);
      letter-spacing: 0.54em; margin-right: -0.54em; color: rgba(245, 243, 238, 0.86);
      text-shadow: 0 1px 12px rgba(5, 8, 13, 0.6);
    }
    #load .bar { width: min(46vw, 200px); height: 1px; background: var(--hair); margin-top: 38px; overflow: hidden; }
    #load .bar i { display: block; height: 100%; background: var(--sun); transform-origin: 0 50%; transform: scaleX(0.08); transition: transform 0.35s cubic-bezier(0.2, 0.6, 0.2, 1); }
    #load .stage { margin-top: 14px; font-size: 11px; letter-spacing: 0.32em; color: var(--faint); }

    /* ---- Translucent Left Scrim (leaves right 60% wide open for 360-degree live world!) ---- */
    .scrim-left {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(90deg, rgba(7, 9, 13, 0.86) 0%, rgba(7, 9, 13, 0.68) 22%, rgba(7, 9, 13, 0.28) 40%, rgba(7, 9, 13, 0) 58%);
    }
    .scrim-modal {
      position: absolute; inset: 0; pointer-events: auto;
      background: rgba(7, 9, 13, 0.76); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }

    /* ---- Editorial Controls & Buttons ---- */
    .clickable { pointer-events: auto; }
    .go-btn {
      pointer-events: auto; position: relative; appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(180deg, #f8d8a6, #eea94c); color: #191208;
      border-radius: 999px; min-width: 192px; height: 52px; padding: 0 34px;
      font-family: var(--f-song); font-weight: 700; font-size: 17px; letter-spacing: 0.65em; text-indent: 0.65em;
      box-shadow: 0 6px 26px rgba(255, 178, 82, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.55);
      transition: filter 0.2s ease, transform 0.16s ease;
    }
    .go-btn::after {
      content: ""; position: absolute; inset: -7px; border-radius: 999px;
      border: 1px solid rgba(255, 208, 138, 0.72); opacity: 0; animation: breathe 3.1s ease-in-out infinite;
    }
    .go-btn:hover { filter: brightness(1.07); }
    .go-btn:active { transform: scale(0.97); }
    @keyframes breathe { 0%, 100% { opacity: 0; transform: scale(0.96); } 50% { opacity: 0.88; transform: scale(1); } }

    .e-btn {
      pointer-events: auto; cursor: pointer; border: 1px solid var(--hair);
      background: rgba(10, 13, 19, 0.42); color: var(--snow);
      padding: 8px 16px; border-radius: 999px; font-family: var(--f-ui); font-weight: 400; font-size: 13px;
      letter-spacing: 0.12em; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.1s ease;
    }
    .e-btn:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(255, 208, 138, 0.58); }
    .e-btn:active { transform: scale(0.97); }
    .e-btn.on { background: rgba(255, 208, 138, 0.18); border-color: var(--sun); color: var(--sun); }
    .e-btn.fire { background: linear-gradient(135deg, #ff6a26, #df3614); border-color: rgba(255, 210, 170, 0.5); color: #fff; font-weight: 500; }
    .e-btn:disabled { opacity: 0.36; cursor: not-allowed; }

    /* Left-Rail Menu List (Cold-Smoke style minimal rows) */
    .rail {
      position: absolute; top: 0; left: 0; bottom: 0; width: min(360px, 86vw);
      padding: calc(var(--gt) + 8px) 26px var(--gb) var(--gl);
      display: flex; flex-direction: column; overflow-y: auto; pointer-events: auto;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.18) transparent;
    }
    .rail-kicker { font-family: var(--f-lat); font-weight: 500; font-size: 10px; letter-spacing: 0.36em; color: var(--sun); text-transform: uppercase; margin-bottom: 10px; }
    .rail-title { font-family: var(--f-song); font-weight: 500; font-size: 26px; letter-spacing: 0.24em; margin-bottom: 18px; }
    .rail-item {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 12px 2px; border: 0; border-bottom: 1px solid rgba(245, 243, 238, 0.12);
      background: transparent; color: var(--snow); font-family: var(--f-ui); font-size: 15px;
      letter-spacing: 0.14em; text-align: left; cursor: pointer; transition: color 0.16s, padding-left 0.16s;
    }
    .rail-item:hover { color: var(--sun); padding-left: 6px; }
    .rail-item small { font-family: var(--f-lat); font-size: 11px; letter-spacing: 0.12em; color: var(--faint); }
    .rail-sec { margin-top: 16px; }
    .rail-label { font-family: var(--f-lat); font-size: 10px; letter-spacing: 0.28em; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      cursor: pointer; border: 1px solid rgba(245, 243, 238, 0.18); background: rgba(12, 15, 22, 0.42);
      color: var(--dim); padding: 6px 12px; border-radius: 999px; font-size: 12px; letter-spacing: 0.08em;
      transition: all 0.15s;
    }
    .pill:hover { color: var(--snow); border-color: rgba(255, 208, 138, 0.5); }
    .pill.on { background: rgba(255, 208, 138, 0.18); border-color: var(--sun); color: var(--sun); }

    .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; font-size: 12px; color: var(--dim); }
    .slider-row input[type=range] { flex: 1; accent-color: var(--sun); cursor: pointer; height: 3px; }

    /* Frameless Editorial Telemetry HUD */
    .hud-tag { position: absolute; left: var(--gl); top: var(--gt); padding-left: 14px; text-shadow: 0 1px 16px rgba(5, 8, 13, 0.7); }
    .hud-tag::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 1px; background: var(--sun); }
    .hud-tag small { display: block; font-family: var(--f-lat); font-size: 10px; letter-spacing: 0.30em; color: var(--dim); text-transform: uppercase; }
    .hud-tag b { display: block; margin-top: 3px; font-family: var(--f-song); font-weight: 500; font-size: clamp(18px, 2.4vw, 24px); letter-spacing: 0.20em; }

    .hud-spd { position: absolute; left: var(--gl); bottom: var(--gb); text-shadow: 0 2px 18px rgba(5, 8, 13, 0.72); }
    .hud-spd .num { font-family: var(--f-lat); font-weight: 300; font-size: clamp(46px, 7.2vw, 76px); line-height: 0.88; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .hud-spd .unit { font-family: var(--f-lat); font-weight: 500; font-size: 10px; letter-spacing: 0.34em; color: var(--dim); margin-top: 6px; }
    .hud-bar { width: 132px; height: 2px; background: var(--hair); margin-top: 8px; overflow: hidden; }
    .hud-bar i { display: block; height: 100%; background: var(--sun); width: 0%; transition: width 0.08s linear; }
    .hud-bar.adr { height: 4px; border-radius: 2px; margin-top: 5px; }
    .hud-bar.adr i { background: linear-gradient(90deg, var(--sun), var(--accent)); }

    .hud-right { position: absolute; right: var(--gr); bottom: var(--gb); text-align: right; text-shadow: 0 2px 16px rgba(5, 8, 13, 0.72); }
    .hud-right .big { font-family: var(--f-lat); font-weight: 300; font-size: clamp(26px, 3.6vw, 38px); line-height: 1; font-variant-numeric: tabular-nums; }
    .hud-right .sub { font-family: var(--f-lat); font-size: 11px; letter-spacing: 0.22em; color: var(--dim); margin-top: 6px; }

    .orbit-hint {
      position: absolute; right: var(--gr); bottom: var(--gb); pointer-events: none;
      font-size: 11px; letter-spacing: 0.16em; color: rgba(245, 243, 238, 0.56);
      text-shadow: 0 1px 12px rgba(5, 8, 13, 0.8);
    }

    .card {
      background: rgba(14, 17, 24, 0.62); border: 1px solid var(--hair);
      border-radius: 12px; padding: 16px 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gl" tabindex="-1"></canvas>
    <div id="ui"></div>
    <div id="load">
      <div class="mark center">
        <div class="cn">暴走速降</div>
        <div class="rule"></div>
        <div class="en">CRAZYBIKE</div>
      </div>
      <div class="bar"><i id="load-fill"></i></div>
      <div class="stage" id="load-stage">正在雕塑车手模型</div>
    </div>
  </div>
  <script>
/*__JS__*/
  </script>
</body>
</html>
